name: xhs-workbench
services:
  web:
    image: xhs-workbench:1.2.0
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${XHS_PORT:-8779}:8777"
    volumes:
      - xhs-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  xhs-data:
